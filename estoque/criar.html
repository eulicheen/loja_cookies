<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>

    <link rel="stylesheet" href="/estoque/css/main.css">
</head>
<body>

    <header-js></header-js>


    <nav-js></nav-js>

    <main>
        <section>

            <div id="mensagem">Escolha um produto para editar</div>
    
            <!-- Formulário para Editar -->
            <form id="form">    

                <input type="hidden" id="estoque">

                <input type="text" id="nome" placeholder="Nome" required>
                <input type="number" id="quantidade" placeholder="Quantidade" required>
                <input type="number" id="preco" placeholder="Preço" required>

                <button type="submit" id="botao">Criar produto</button>
           
            </form>

                <div id="container"></div>

        </section>

    </main>


    <footer-js></footer-js>

    <script src="js/components.js"></script>
    <script type="module" src="./js/criar.js"></script>
    
</body>
</html>
