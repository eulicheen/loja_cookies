<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>

    <link rel="stylesheet" href="./css/main.css">

    <style>

    .estoque-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
    .actions { margin-top: 10px; }

    </style>
</head>

<body>

    <header-js></header-js>


    <nav-js></nav-js>

    <main>
        
        <section>

            <div id="mensagem">Escolha um produto para editar</div>
    
            <!-- Formulário para Editar -->
            <form id="form" class="oculto">    

                <input type="hidden" id="estoque">

                <input type="text" id="nome" placeholder="Nome" required>
                <input type="number" id="quantidade" placeholder="Quantidade" required>
                <input type="number" id="preco" placeholder="Preço" required>

                <button type="submit" id="botao">Alterar produto</button>
           
            </form>

                <div id="container"></div>

        </section>

    </main>


    <footer-js></footer-js>

    <script src="js/components.js"></script>
    <script type="module" src="./js/editar.js"></script>
    
</body>
</html>
